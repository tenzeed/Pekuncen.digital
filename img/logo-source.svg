<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="roofshine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f1ff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- House silhouette (pentagon: roof + body) -->
  <path d="M256 118 L388 232 L388 388 L124 388 L124 232 Z" fill="url(#roofshine)"/>

  <!-- Door cut-out for visual grounding -->
  <path d="M226 388 L226 320 Q226 302 244 302 L268 302 Q286 302 286 320 L286 388 Z" fill="#0f2a63" opacity="0.14"/>

  <!-- Network: 4 RT nodes connected to 1 RW hub -->
  <g stroke="#f59e0b" stroke-width="7" stroke-linecap="round">
    <line x1="256" y1="214" x2="196" y2="252"/>
    <line x1="256" y1="214" x2="316" y2="252"/>
    <line x1="256" y1="214" x2="196" y2="336"/>
    <line x1="256" y1="214" x2="316" y2="336"/>
  </g>

  <!-- RT satellite nodes -->
  <circle cx="196" cy="252" r="13" fill="#ffffff" stroke="#f59e0b" stroke-width="6"/>
  <circle cx="316" cy="252" r="13" fill="#ffffff" stroke="#f59e0b" stroke-width="6"/>
  <circle cx="196" cy="336" r="13" fill="#ffffff" stroke="#f59e0b" stroke-width="6"/>
  <circle cx="316" cy="336" r="13" fill="#ffffff" stroke="#f59e0b" stroke-width="6"/>

  <!-- RW central hub -->
  <circle cx="256" cy="214" r="22" fill="#f59e0b"/>
  <circle cx="256" cy="214" r="22" fill="none" stroke="#ffffff" stroke-width="4"/>
</svg>
